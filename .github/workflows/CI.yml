name: CI

on:
    push:
        branches:
            - "main"
            - "v*.x"
            - "v*.x-*"


permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    check-code:
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        uses: joseftraxler/.github/.github/workflows/check-php.yml@main

    tests:
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        uses: joseftraxler/.github/.github/workflows/pest.yml@main

    release:
        if: github.event_name == 'push'
        needs: [check-code, tests]
        uses: joseftraxler/.github/.github/workflows/release.yml@main
        with:
            target: ${{ github.ref_name }}
