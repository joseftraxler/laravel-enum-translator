name: Release

on:
    workflow_run:
        workflows: [ "CI" ]
        types:
            - completed

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        if: >
            github.event.workflow_run.conclusion == 'success'
            && (
              github.event.workflow_run.head_branch == 'main'
              || (
                startsWith(github.event.workflow_run.head_branch, 'v')
                && contains(github.event.workflow_run.head_branch, '.x')
              )
            )
            && !contains(github.event.workflow_run.head_commit.message, '[skip ci]')

        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0

            - name: Cache release npm packages
              uses: actions/cache@v5
              with:
                path: |
                  release/node_modules
                  ~/.npm
                key: npm-release-${{ hashFiles('release/package-lock.json') }}

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                  node-version: '24'

            -   name: Install release packages
                working-directory: release
                run: |
                  npm install --no-fund --prefer-offline --no-progress
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git add package-lock.json
                  if git diff --cached --quiet; then
                    echo "No changes in package-lock.json, skipping commit"
                  else
                    git commit -m "chore(release): release/package-lock.json updated [skip ci]"
                    git push
                  fi

            - name: Run semantic-release
              working-directory: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
